name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Core checks across the supported Node.js versions.
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - if: matrix.node-version != 20
        run: npm run build
      - run: npm test
      - name: Check package contents
        if: matrix.node-version != 20
        run: npm pack --dry-run

  # Benchmark the current branch, then compare against main.
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Benchmark main branch (baseline)
        run: |
          git checkout main
          npm ci
          npm run bench
          mv bench-results bench-baseline
      - name: Checkout current branch
        run: git checkout ${{ github.sha }}
      - run: npm ci
      - name: Compare benchmark against main
        run: npm run bench -- --reporter=verbose
        env:
          BENCH_BASELINE: bench-baseline

  # Run the library on the Bun runtime via the Node sample.
  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            samples/node/package.json
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run build
      - name: Run samples on Bun
        working-directory: samples/node
        run: |
          bun install
          bun app.js
          bun streaming.js

  # Run the sample's tests on the Cloudflare Workers runtime.
  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            samples/cloudflare/package.json
      - run: npm ci
      - run: npm run test:workers
      - run: npm run build
      - name: Run the sample on the Workers runtime
        working-directory: samples/cloudflare
        run: |
          npm install
          npm run typecheck
          npx vitest run

  # Run the suite in real Chromium and Firefox browsers via Vitest browser mode.
  browser:
    runs-on: ubuntu-latest
    # System deps and browsers are baked into the image; installing them with
    # apt took up to 8 minutes on slow mirrors. Keep the tag in step with the
    # playwright devDependency (a mismatch only costs a ~10s browser download).
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npx playwright install chromium firefox
      - run: npm run test:browser

  # Run the sample on the Fastly Compute runtime (local Viceroy, no API token).
  fastly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            samples/fastly/package.json
      - run: npm ci
      - run: npm run build
      - uses: fastly/compute-actions/setup@v14
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run sample on Fastly Compute (Viceroy)
        working-directory: samples/fastly
        run: |
          npm install
          fastly compute build
          nohup fastly compute serve --addr 127.0.0.1:7676 &
          curl -sf --retry 60 --retry-delay 1 --retry-all-errors -o /dev/null http://127.0.0.1:7676/
          node test.mjs
